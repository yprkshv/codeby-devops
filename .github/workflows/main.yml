name: Maven CI/CD

on:
  push:
    branches: [ lesson28 ]
  pull_request:
    branches: [ lesson28 ] 

jobs:
  build_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
    
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          
      - name: Cache the Maven packages to speed up build
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('/lesson28/*/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: helloworld-build
        run: mvn -B -f lesson28/helloworld/pom.xml compile

      - name: helloworld-test
        run: mvn -B -f lesson28/helloworld/pom.xml test

      - name: helloworld jar
        run: mvn -B -f lesson28/helloworld/pom.xml package -DskipTests

      - name: helloworld 
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-helloworld
          path: lesson28/helloworld/target/surefire-reports
          if-no-files-found: ignore

      - name: helloworld - upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-helloworld
          path: lesson28/helloworld/target/*.jar
          if-no-files-found: error

      - name: hellojenkins-build
        run: mvn -B -f lesson28/hellojenkins/pom.xml compile

      - name: hellojenkins-test
        run: mvn -B -f lesson28/hellojenkins/pom.xml test

      - name: hellojenkins jar
        run: mvn -B -f lesson28/hellojenkins/pom.xml package -DskipTests

      - name: hellojenkins 
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-hellojenkins
          path: lesson28/hellojenkins/target/surefire-reports
          if-no-files-found: ignore

      - name: hellojenkins - upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-hellojenkins
          path: lesson28/hellojenkins/target/*.jar
          if-no-files-found: error

      - name: hellodevops-build
        run: mvn -B -f lesson28/hellodevops/pom.xml compile

      - name: hellodevops-test
        run: mvn -B -f lesson28/hellodevops/pom.xml test

      - name: hellodevops jar
        run: mvn -B -f lesson28/hellodevops/pom.xml package -DskipTests

      - name: hellodevops 
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-hellodevops
          path: lesson28/hellodevops/target/surefire-reports
          if-no-files-found: ignore

      - name: hellodevops - upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-hellodevops
          path: lesson28/hellodevops/target/*.jar
          if-no-files-found: error
          
  build-docker-image:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [build_test]
    steps:
      - uses: actions/checkout@v5
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{secrets.DOCKER_PASS }}
      - name: Build Container image
        run: |
          docker build -t ${{ secrets.DOCKER_REPO }}:helloworld -f lesson28/Dockerfile lesson28/helloworld
          docker build -t ${{ secrets.DOCKER_REPO }}:hellojenkins -f lesson28/Dockerfile lesson28/hellojenkins
          docker build -t ${{ secrets.DOCKER_REPO }}:hellodevops -f lesson28/Dockerfile lesson28/hellodevops
      - name: Publish Docker image
        run: |
          docker push ${{ secrets.DOCKER_REPO }}:helloworld
          docker push ${{ secrets.DOCKER_REPO }}:hellojenkins
          docker push ${{ secrets.DOCKER_REPO }}:hellodevops

