name: Maven CI/CD

on:
  push:
    branches: [ lesson28 ]
  pull_request:
    branches: [ lesson28 ] 

jobs:
  build_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
    
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          
      - name: Cache the Maven packages to speed up build
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('/lesson28/*/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: helloworld-build
        run: mvn -B -f lesson28/helloworld/pom.xml compile

      - name: helloworld-test
        run: mvn -B -f lesson28/helloworld/pom.xml test

      - name: helloworld jar
        run: mvn -B -f lesson28/helloworld/pom.xml package -DskipTests

      - name: helloworld 
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-helloworld
          path: lesson28/helloworld/target/surefire-reports
          if-no-files-found: ignore

      - name: helloworld - upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-helloworld
          path: lesson28/helloworld/target/*.jar
          if-no-files-found: error
      

