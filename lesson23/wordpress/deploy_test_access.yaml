apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp2-pvc
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  selector:
    matchLabels:
      pv-for: wp2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp2
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wp2
  template:
    metadata:
      labels:
        app: wp2
    spec:
      containers:
        - name: wp2
          image: wordpress:latest
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql-service.dev.svc.cluster.local:3306
            - name: WORDPRESS_DB_DATABASE
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wpuser
            - name: WORDPRESS_DB_PASSWORD
              value: passw0rd
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: wp2-storage
              mountPath: /var/www/html
      volumes:
        - name: wp2-storage
          persistentVolumeClaim:
            claimName: wp2-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: wp2
  namespace: dev
spec:
  type: NodePort
  selector:
    app: wp2
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-wp2
  labels:
    pv-for: wp2
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/data/wordpress
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube-m02
