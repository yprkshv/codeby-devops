apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostics-sa
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reader
  namespace: dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: diagnostics-binding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: diagnostics-sa
    namespace: dev
roleRef:
  kind: Role
  name: reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: diagnostics
  namespace: dev
spec:
  serviceAccountName: diagnostics-sa
  containers:
    - name: diagnostics
      image: bitnami/kubectl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "=== get wordpress ==="
          kubectl get pods -n dev -l app=wordpress -o wide
          echo "=== get all pods ==="
          kubectl get pods -n dev -o wide
          echo "=== complete ==="
          sleep infinity