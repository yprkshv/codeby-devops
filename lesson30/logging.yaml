version: '3'
services:
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:7.6.2
    expose:
      - 9200
    environment:
      - discovery.type=single-node
      - "ES_JAWA_OPTS=-Xms512m - Xmx512m"
    ports:
      - 9200:9200
    networks:
      - logging

  fluentd:
    container_name: fluentd
    image: $REDDIT_REPO_APP/fluentd:logging
    volumes:
      - $FLUENTD_PATH:/fluentd/etc
    depends_on:
      - elasticsearch
    ports:
      - 24224:24224
      - 24224:24224/udp
    networks:
      - logging

  kibana:
    container_name: kibana
    image: kibana:7.6.2
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    networks:
      - logging

networks:
  logging: